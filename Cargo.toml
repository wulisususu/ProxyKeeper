[package]
name = "proxy-keeper"
version = "0.1.0"
edition = "2021"

[dependencies]
winreg = "0.52"
clipboard-win = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
